<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PureSmile - ร้านขายแปรงสีฟัน</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800">
  <nav class="bg-teal-600 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">🦷 PureSmile Official</h1>
    <a href="admin.html" class="bg-teal-800 px-3 py-1 rounded text-sm">ระบบแพ็คสินค้า (แอดมิน) →</a>
  </nav>
  <main class="max-w-4xl mx-auto py-8 px-4">
    <h2 class="text-2xl font-bold mb-6 text-center">เลือกซื้อแปรงสีฟัน (2 รุ่น)</h2>
    <div class="grid md:grid-cols-2 gap-6 mb-8">
      <div class="bg-white p-6 rounded-xl shadow border">
        <img src="images/sku1.jpg" class="w-full h-48 object-cover rounded mb-4 bg-slate-200">
        <span class="bg-teal-100 text-teal-800 text-xs font-bold px-2 py-1 rounded">SKU-01</span>
        <h3 class="text-xl font-bold mt-2">รุ่น Soft Charcoal (ชาโคล)</h3>
        <p class="text-sm text-slate-500 mt-1">ขนนุ่มพิเศษ ลดแบคทีเรีย</p>
        <div class="mt-4 flex justify-between items-center">
          <span class="text-lg font-bold text-teal-600">฿120</span>
          <div>จำนวน: <input type="number" id="qty_sku1" value="0" min="0" onchange="calcTotal()" class="w-16 border rounded p-1 text-center"></div>
        </div>
      </div>
      <div class="bg-white p-6 rounded-xl shadow border">
        <img src="images/sku2.jpg" class="w-full h-48 object-cover rounded mb-4 bg-slate-200">
        <span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded">SKU-02</span>
        <h3 class="text-xl font-bold mt-2">รุ่น Ultra Gum Care</h3>
        <p class="text-sm text-slate-500 mt-1">ดูแลเหงือก เหมาะสำหรับคนจัดฟัน</p>
        <div class="mt-4 flex justify-between items-center">
          <span class="text-lg font-bold text-teal-600">฿150</span>
          <div>จำนวน: <input type="number" id="qty_sku2" value="0" min="0" onchange="calcTotal()" class="w-16 border rounded p-1 text-center"></div>
        </div>
      </div>
    </div>
    <div class="bg-white p-6 rounded-xl shadow border max-w-xl mx-auto">
      <h3 class="text-xl font-bold mb-4">กรอกที่อยู่จัดส่ง</h3>
      <form id="orderForm" onsubmit="submitOrder(event)" class="space-y-4">
        <input type="text" id="custName" required class="w-full border rounded p-2" placeholder="ชื่อ-นามสกุล ผู้รับ">
        <input type="tel" id="custPhone" required class="w-full border rounded p-2" placeholder="เบอร์โทรศัพท์">
        <textarea id="custAddress" required rows="3" class="w-full border rounded p-2" placeholder="ที่อยู่จัดส่งพร้อมรหัสไปรษณีย์"></textarea>
        <div class="bg-slate-100 p-3 rounded flex justify-between font-bold">
          <span>ยอดรวม:</span><span id="totalDisplay" class="text-teal-700 text-xl">฿0</span>
        </div>
        <button type="submit" id="submitBtn" class="w-full bg-teal-600 text-white font-bold py-3 rounded">ยืนยันการสั่งซื้อ</button>
      </form>
    </div>
  </main>
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw13C-fBCElTo6yljznN_joN6Jk1Nf1y3bK8ZVijMm7oRsz9Ba72nm8akzrfijw3mQSyw/exec";

    function calcTotal() {
      const q1 = parseInt(document.getElementById("qty_sku1").value) || 0;
      const q2 = parseInt(document.getElementById("qty_sku2").value) || 0;
      const total = (q1 * 120) + (q2 * 150);
      document.getElementById("totalDisplay").innerText = "฿" + total;
      return total;
    }
    async function submitOrder(e) {
      e.preventDefault();
      const q1 = parseInt(document.getElementById("qty_sku1").value) || 0;
      const q2 = parseInt(document.getElementById("qty_sku2").value) || 0;
      const total = calcTotal();
      if (q1 === 0 && q2 === 0) return alert("กรุณาเลือกสินค้าอย่างน้อย 1 ชิ้น");
      const btn = document.getElementById("submitBtn");
      btn.disabled = true; btn.innerText = "กำลังส่งข้อมูล...";
      const res = await fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "create", name: document.getElementById("custName").value, phone: document.getElementById("custPhone").value, address: document.getElementById("custAddress").value, sku1: q1, sku2: q2, total: total })
      });
      const data = await res.json();
      alert("สั่งซื้อสำเร็จ! รหัสออเดอร์: " + data.orderId);
      document.getElementById("orderForm").reset(); calcTotal();
      btn.disabled = false; btn.innerText = "ยืนยันการสั่งซื้อ";
    }
  </script>
</body>
</html>
